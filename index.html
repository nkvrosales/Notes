<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        (function () {
            var t = localStorage.getItem('theme') || 'system';
            var effective = t === 'system'
                ? (window.matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark')
                : t;
            if (effective === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
</head>
<body>

<div class="container">
    <div class="theme-toggle" id="themeToggle">
        <button class="theme-option active" data-theme="system" aria-label="System theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                <line x1="8" y1="21" x2="16" y2="21"/>
                <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
        </button>
        <button class="theme-option" data-theme="light" aria-label="Light theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </button>
        <button class="theme-option" data-theme="dark" aria-label="Dark theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
        <div class="theme-indicator" id="themeIndicator"></div>
    </div>

    <h1>Notes</h1>
    <div class="subtitle">Your thoughts, organized.</div>

    <div class="search-field">
        <input type="text" id="searchInput" placeholder="Search notes…">
    </div>

    <div class="new-note">
        <input type="text" id="noteTitle" placeholder="Title">
        <textarea id="noteContent" placeholder="Start writing…"></textarea>
        <button class="btn-primary" id="addNoteBtn">SAVE NOTE →</button>
    </div>

    <div class="notes-list" id="notesGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none">No notes yet.</div>
</div>

<script src="script.js"></script>
</body>
</html>
